# Install this file as /etc/nginx/sites-available/trip-helper.conf and replace
# APP_DOMAIN only during server provisioning. Install trip-helper-log-format.conf
# in /etc/nginx/conf.d/ first.

server {
    listen 80;
    listen [::]:80;
    server_name APP_DOMAIN;

    access_log /var/log/nginx/trip-helper.access.log trip_helper;
    error_log /var/log/nginx/trip-helper.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/trip-helper;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name APP_DOMAIN;

    root /var/www/trip-helper;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/APP_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/APP_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    access_log /var/log/nginx/trip-helper.access.log trip_helper;
    error_log /var/log/nginx/trip-helper.error.log warn;

    client_max_body_size 100m;
    proxy_connect_timeout 15s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Job events may be delivered over SSE and must never be buffered.
    location ^~ /api/v1/jobs/ {
        proxy_pass http://10.66.0.2:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_redirect off;
        add_header X-Accel-Buffering "no" always;
    }

    # Uploads and authenticated API responses are streamed through the VPS and
    # never buffered to its filesystem.
    location ^~ /api/ {
        proxy_pass http://10.66.0.2:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_redirect off;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
