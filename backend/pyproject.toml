[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trip-helper-api"
version = "1.0.0"
description = "Private A100 API for the Trip Helper web application"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<24",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pillow>=10,<12",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pymupdf>=1.24,<2",
  "python-multipart>=0.0.12,<1",
  "redis>=5,<6",
  "reportlab>=4,<5",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "parsers*", "services*", "models*", "providers*", "routers*", "exporters*", "utils*"]

[tool.setuptools]
py-modules = ["enums", "config", "database", "main"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["data", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
